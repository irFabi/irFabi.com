    <title>ir_Fabi | Links</title>

    <!-- Favicon / Browser Tab Logo -->
    <link rel="icon" type="image/jpeg" href="./avatar.jpg?v=2">
    <link rel="shortcut icon" type="image/jpeg" href="./avatar.jpg?v=2">
    <link rel="apple-touch-icon" href="./avatar.jpg?v=2">

    <!-- Fonts, Phosphor Icons & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            future: { hoverOnlyWhenSupported: true },
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['"Changa One"', 'sans-serif']
                    },
                    colors: {
                        md: {
                            primary: 'var(--md-primary)',
                            onPrimary: 'var(--md-on-primary)',
                            primaryContainer: 'var(--md-primary-container)',
                            onPrimaryContainer: 'var(--md-on-primary-container)',
                            secondaryContainer: 'var(--md-secondary-container)',
                            onSecondaryContainer: 'var(--md-on-secondary-container)',
                            surface: 'var(--md-surface)',
                            onSurface: 'var(--md-on-surface)',
                            surfaceVariant: 'var(--md-surface-variant)',
                            onSurfaceVariant: 'var(--md-on-surface-variant)',
                            surfaceContainerLow: 'var(--md-surface-container-low)',
                            surfaceContainer: 'var(--md-surface-container)',
                            surfaceContainerHigh: 'var(--md-surface-container-high)',
                            surfaceContainerHighest: 'var(--md-surface-container-highest)',
                            outline: 'var(--md-outline)',
                            bodyBg: 'var(--md-body-bg)'
                        }
                    },
                    transitionTimingFunction: {
                        bouncy: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
                    }
                }
            }
        };
    </script>

    <style>

        [data-theme="amber"] {

            --md-surface-container-low: #f2f7f8; --md-surface-container: #eff4f5;

        /* Liquid Crystal Theme (High-Contrast Calm Mist & Midnight Slate) */
        [data-theme="liquid-crystal"] {
            --md-primary: #1d4ed8; --md-on-primary: #ffffff;
            --md-primary-container: #dbeafe; --md-on-primary-container: #0f172a;
            --md-secondary-container: #dce7f5; --md-on-secondary-container: #1e293b;
            --md-surface: #f4f7fb; --md-on-surface: #0f172a;
            --md-surface-variant: #d9e3f0; --md-on-surface-variant: #334155;
            --md-surface-container-low: #eef3f9; --md-surface-container: #e8eff7;
            --md-surface-container-high: #dde7f3; --md-surface-container-highest: #d0deee;
            --md-outline: #64748b; --md-body-bg: #e5ecf4;
        }
        .dark[data-theme="liquid-crystal"] {
            --md-primary: #93c5fd; --md-on-primary: #0b192c;
            --md-primary-container: #1e3a5f; --md-on-primary-container: #e0f2fe;
            --md-secondary-container: #1c293c; --md-on-secondary-container: #cbd5e1;
            --md-surface: #0e1420; --md-on-surface: #f1f5f9;
            --md-surface-variant: #253349; --md-on-surface-variant: #94a3b8;
            --md-surface-container-low: #101725; --md-surface-container: #131c2c;
            --md-surface-container-high: #1a2538; --md-surface-container-highest: #223047;
            --md-outline: #64748b; --md-body-bg: #0a0e16;
        }

        /* =========================================================
           2. BASE, VIEW TRANSITIONS & AMBIENT BACKGROUNDS
           ========================================================= */
        ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
        ::view-transition-old(root) { z-index: 1; }
        ::view-transition-new(root) { z-index: 9999; }

        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        * {
            transition: background-color 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
                        color 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
                        fill 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        :root { --shadow-op-1: 0.14; --shadow-op-2: 0.08; }
        .dark { --shadow-op-1: 0.45; --shadow-op-2: 0.28; }
        .shadow-m3-1 { box-shadow: 0 1px 3px rgba(0, 0, 0, var(--shadow-op-1)), 0 1px 2px rgba(0, 0, 0, var(--shadow-op-2)); }
        .shadow-m3-2 { box-shadow: 0 4px 12px rgba(0, 0, 0, var(--shadow-op-1)), 0 2px 4px rgba(0, 0, 0, var(--shadow-op-2)); }
        .shadow-m3-3 { box-shadow: 0 12px 28px rgba(0, 0, 0, var(--shadow-op-1)), 0 4px 8px rgba(0, 0, 0, var(--shadow-op-2)); }

        /* Ambient Background Switcher Layers (Always pointer-events: none) */
        .bg-mode-layer { display: none; pointer-events: none; }
        html[data-bg="blobs"] #bg-blobs { display: block; }
        html[data-bg="dots"] #bg-dots { display: block; }
        html[data-bg="aurora"] #bg-aurora { display: block; }

        /* Automatically tone down background brightness in Liquid mode for crisp readability */
        html[data-surface="liquid"] #bg-blobs,
        html[data-surface="liquid"] #bg-aurora {
            opacity: 0.42;
        }

        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(28px, -36px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .animate-blob { animation: blobFloat 15s infinite alternate ease-in-out; will-change: transform; }
        .delay-2s { animation-delay: 2s; }
        .delay-4s { animation-delay: 4s; }

        #bg-dots {
            background-image: radial-gradient(color-mix(in srgb, var(--md-primary) 26%, transparent) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            opacity: 0.55;
        }

        @keyframes auroraDrift {
            0% { transform: translate(-8%, -6%) rotate(-6deg) scale(1); }
            50% { transform: translate(8%, 6%) rotate(5deg) scale(1.1); }
            100% { transform: translate(-5%, 4%) rotate(-3deg) scale(1.02); }
        }
        .aurora-ribbon {
            position: absolute;
            inset: -25%;
            filter: blur(72px);
            will-change: transform;
            animation: auroraDrift 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* =========================================================
           3. SURFACE MODES: SOLID | FROSTED (Milchglas) | LIQUID
           ========================================================= */
        /* SOLID */
        html[data-surface="solid"] .glass-card {
            background-color: var(--md-surface);
            border: 1px solid color-mix(in srgb, var(--md-outline) 22%, transparent);
        }
        html[data-surface="solid"] .glass-button {
            background-color: var(--md-surface-container-high);
            border: 1px solid color-mix(in srgb, var(--md-outline) 14%, transparent);
        }
        html[data-surface="solid"] .glass-floating {
            background-color: var(--md-surface-container-highest);
            border: 1px solid color-mix(in srgb, var(--md-outline) 22%, transparent);
        }

        /* FROSTED (Milchglas) */
        html[data-surface="frosted"] .glass-card {
            background-color: color-mix(in srgb, var(--md-surface) 50%, transparent);
            backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid color-mix(in srgb, var(--md-on-surface) 10%, transparent);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        html[data-surface="frosted"].dark .glass-card {
            background-color: color-mix(in srgb, var(--md-surface-container) 42%, transparent);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.42), inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        html[data-surface="frosted"] .glass-button {
            background-color: color-mix(in srgb, var(--md-surface-container-high) 48%, transparent);
            backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid color-mix(in srgb, var(--md-on-surface) 8%, transparent);
        }
        html[data-surface="frosted"].dark .glass-button {
            background-color: color-mix(in srgb, var(--md-surface-container-highest) 34%, transparent);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        html[data-surface="frosted"] .glass-floating {
            background-color: color-mix(in srgb, var(--md-surface-container-high) 64%, transparent);
            backdrop-filter: blur(24px) saturate(185%); -webkit-backdrop-filter: blur(24px) saturate(185%);
            border: 1px solid color-mix(in srgb, var(--md-on-surface) 14%, transparent);
        }
        html[data-surface="frosted"].dark .glass-floating {
            background-color: color-mix(in srgb, var(--md-surface-container-highest) 56%, transparent);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* REFINED LIQUID GLASS (Smoked-Crystal Dark & Calm Light) */
        html[data-surface="liquid"] .glass-card {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.70) 0%, color-mix(in srgb, var(--md-surface) 60%, transparent) 100%);
            backdrop-filter: blur(36px) saturate(165%); -webkit-backdrop-filter: blur(36px) saturate(165%);
            border: 1px solid rgba(15, 23, 42, 0.09);
            border-top-color: rgba(255, 255, 255, 0.82);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.70), inset 0 -1px 0 rgba(15, 23, 42, 0.05);
        }
        html[data-surface="liquid"].dark .glass-card {
            background: linear-gradient(155deg, color-mix(in srgb, var(--md-surface-container) 76%, rgba(255, 255, 255, 0.03)) 0%, color-mix(in srgb, var(--md-surface) 68%, transparent) 100%);
            backdrop-filter: blur(38px) saturate(160%); -webkit-backdrop-filter: blur(38px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-top-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 22px 52px rgba(0, 0, 0, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(0, 0, 0, 0.36);
        }
        /* Subtle top meniscus highlight */
        html[data-surface="liquid"] .glass-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.20) 0%, transparent 34%);
        }
        html[data-surface="liquid"].dark .glass-card::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 34%);
        }

        html[data-surface="liquid"] .glass-button {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.64) 0%, color-mix(in srgb, var(--md-surface-container-high) 54%, transparent) 100%);
            backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(15, 23, 42, 0.09);
            border-top-color: rgba(255, 255, 255, 0.78);
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.62);
        }
        html[data-surface="liquid"].dark .glass-button {
            background: linear-gradient(160deg, color-mix(in srgb, var(--md-surface-container-highest) 66%, rgba(255, 255, 255, 0.03)) 0%, color-mix(in srgb, var(--md-surface-container) 60%, transparent) 100%);
            backdrop-filter: blur(26px) saturate(155%); -webkit-backdrop-filter: blur(26px) saturate(155%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }

        html[data-surface="liquid"] .glass-floating {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.80) 0%, color-mix(in srgb, var(--md-surface-container-high) 72%, transparent) 100%);
            backdrop-filter: blur(32px) saturate(170%); -webkit-backdrop-filter: blur(32px) saturate(170%);
            border: 1px solid rgba(15, 23, 42, 0.09);
            border-top-color: rgba(255, 255, 255, 0.88);
            box-shadow: 0 16px 38px rgba(15, 23, 42, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.75);
        }
        html[data-surface="liquid"].dark .glass-floating {
            background: linear-gradient(155deg, color-mix(in srgb, var(--md-surface-container-highest) 82%, rgba(255, 255, 255, 0.04)) 0%, color-mix(in srgb, var(--md-surface-container) 80%, transparent) 100%);
            backdrop-filter: blur(34px) saturate(165%); -webkit-backdrop-filter: blur(34px) saturate(165%);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-top-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* Pointer Specular Sheen & Brand-Tinted Icon Glows */
        @media (hover: hover) {
            html:not([data-surface="solid"]) .glass-sheen { position: relative; }
            html:not([data-surface="solid"]) .glass-sheen::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                z-index: 1;
                opacity: 0;
                transition: opacity 240ms ease;
                background: radial-gradient(240px circle at var(--mouse-x, -120px) var(--mouse-y, -120px), rgba(255, 255, 255, 0.16), transparent 65%);
            }
            html[data-surface="liquid"] .glass-sheen::before {
                background: radial-gradient(260px circle at var(--mouse-x, -120px) var(--mouse-y, -120px), rgba(255, 255, 255, 0.22), transparent 65%);
            }
            html[data-surface="frosted"].dark .glass-sheen::before {
                background: radial-gradient(240px circle at var(--mouse-x, -120px) var(--mouse-y, -120px), rgba(255, 255, 255, 0.08), transparent 65%);
            }
            html[data-surface="liquid"].dark .glass-sheen::before {
                background: radial-gradient(260px circle at var(--mouse-x, -120px) var(--mouse-y, -120px), rgba(255, 255, 255, 0.06), transparent 65%);
            }
            html:not([data-surface="solid"]) .glass-sheen:hover::before { opacity: 1; }

            /* Brand-Tinted Icon Glow on Capsule Hover */
            .link-card:hover .brand-icon-box {
                box-shadow: 0 0 24px -2px color-mix(in srgb, var(--brand-color, var(--md-primary)) 72%, transparent) !important;
                background-color: color-mix(in srgb, var(--brand-color, var(--md-primary)) 22%, transparent) !important;
            }
        }

        /* =========================================================
           4. MICRO-ANIMATIONS (Aura, Wobbly Name, Ripple, Accordions)
           ========================================================= */
        @keyframes auraPulse { 0%, 100% { transform: scale(1); opacity: 0.42; } 50% { transform: scale(1.14); opacity: 0.68; } }
        @keyframes liveAuraPulse { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.22); opacity: 0.9; } }
        .avatar-aura {
            background: radial-gradient(circle, var(--md-primary) 0%, transparent 70%);
            animation: auraPulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        .avatar-aura.is-live {
            background: radial-gradient(circle, #ef4444 0%, transparent 70%);
            animation: liveAuraPulse 1.8s ease-in-out infinite;
        }

        @keyframes letterWobble {
            0%   { transform: translateY(0) rotate(0deg) scale(1); }
            30%  { transform: translateY(-8px) rotate(-6deg) scale(1.12); color: var(--md-primary); }
            55%  { transform: translateY(2px) rotate(5deg) scale(0.96); color: var(--md-primary); }
            80%  { transform: translateY(-2px) rotate(-2deg) scale(1.03); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        .wobble-char {
            display: inline-block;
            transform-origin: bottom center;
            will-change: transform;
        }
        .wobble-wave-active .wobble-char {
            animation: letterWobble 560ms cubic-bezier(0.34, 1.56, 0.64, 1);
            animation-delay: calc(var(--char-index, 0) * 42ms);
        }

        /* Squishy Active Press */
        .link-card:active { transform: scale(0.975); }
        .press-btn:active { transform: scale(0.93); }

        /* Ripple */
        .ripple-surface { position: relative; overflow: hidden; transform: translateZ(0); }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 420ms linear;
            background-color: currentColor;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.16; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* Entrance & Smooth Accordions */
        .fade-in-up { opacity: 0; transform: translateY(16px); animation: fadeInUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .expand-wrapper { height: 0; overflow: hidden; transition: height 360ms cubic-bezier(0.34, 1.56, 0.64, 1); will-change: height; }
        .expand-inner { opacity: 0; transform: translateY(-6px) scale(0.98); transform-origin: top; transition: transform 340ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 260ms ease-out; }
        .expand-wrapper.expanded .expand-inner { opacity: 1; transform: translateY(0) scale(1); }

        /* =========================================================
           5. DRAGGABLE SINGLE-VIEW CUSTOMIZATION FAB
           ========================================================= */
        #fab-container {
            touch-action: none;

            transition: width 0.38s cubic-bezier(0.34, 1.56, 0.64, 1),

                        left 0.38s ease, right 0.38s ease, top 0.38s ease, bottom 0.38s ease,
                        transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .fab-collapsed { width: 56px !important; height: 56px !important; border-radius: 28px !important; cursor: grab !important; }
        .fab-collapsed:active { cursor: grabbing !important; }
        .fab-expanded { width: 320px !important; height: 428px !important; max-height: 84vh !important; border-radius: 24px !important; cursor: default !important; }

        @media (max-width: 639px) {
            #fab-container.fab-expanded {
                left: 12px !important; right: 12px !important; bottom: 12px !important; top: auto !important;
                width: calc(100vw - 24px) !important; height: 420px !important; max-height: 82vh !important;
                border-radius: 28px !important;
            }
        }

        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 100%; border-radius: 50%; padding: 0; cursor: pointer; background: transparent; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

            function copyTextSafe(text) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    ta.style.pointerEvents = 'none';
                    document.body.appendChild(ta);
                    ta.select();
                    const ok = document.execCommand('copy');
                    ta.remove();
                    if (ok) return;
                } catch (e) {}
                try {
                    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                        navigator.clipboard.writeText(text).catch(function () {});
                    }
                } catch (e) {}
            }

            function hapticTap(level) {
                try {
                    if (!navigator.vibrate) return;
                    if (level === 'medium') navigator.vibrate(14);
                    else if (level === 'heavy') navigator.vibrate([14, 18, 14]);
                    else navigator.vibrate(5);
                } catch (e) {}
            }

            function showToast(message, iconClass) {
                const toast = document.getElementById('m3-toast');
                const txt = document.getElementById('m3-toast-text');

                if (!toast || !txt || !icon) return;
                txt.textContent = message;
                icon.className = `ph-bold ${iconClass || 'ph-check-circle'} text-md-primary text-lg`;
                clearTimeout(toastTimeout);
                toast.classList.remove('-translate-y-24', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                toastTimeout = setTimeout(function () {
                    toast.classList.add('-translate-y-24', 'opacity-0');
                    toast.classList.remove('translate-y-0', 'opacity-100');
                }, 2200);
            }

            function createRipple(event) {
                hapticTap('light');
                const btn = event && event.currentTarget;
                if (!btn) return;
                const rect = btn.getBoundingClientRect();
                const d = Math.max(btn.clientWidth, btn.clientHeight);
                const r = d / 2;
                const cx = event.clientX !== undefined ? event.clientX : rect.left + r;
                const cy = event.clientY !== undefined ? event.clientY : rect.top + r;
                const circle = document.createElement('span');
                circle.className = 'ripple';
                circle.style.width = `${d}px`;
                circle.style.height = `${d}px`;
                circle.style.left = `${cx - rect.left - r}px`;
                circle.style.top = `${cy - rect.top - r}px`;
                circle.style.color = 'var(--md-primary)';
                const old = btn.querySelector('.ripple');
                if (old) old.remove();
                btn.appendChild(circle);
                setTimeout(function () { circle.remove(); }, 500);
            }

            function attachRippleListeners(el) {
                if (!el) return;
                let isTouch = false;
                el.addEventListener('touchstart', function (e) {
                    isTouch = true;
                    if (e.touches && e.touches.length > 0) {
                        createRipple({ currentTarget: el, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
                    }
                }, { passive: true });
                el.addEventListener('mousedown', function (e) {
                    if (!isTouch) createRipple(e);
                    isTouch = false;
                });
            }

            function updateChromeThemeColor() {
                const meta = document.getElementById('meta-theme-color');
                if (!meta) return;
                requestAnimationFrame(function () {
                    try {
                        const bg = getComputedStyle(document.documentElement).getPropertyValue('--md-body-bg').trim();
                        if (bg) meta.setAttribute('content', bg);
                    } catch (e) {}
                });
            }

            function executeThemeTransition(actionCallback, event) {
                hapticTap('light');
                let reduced = false;
                try {
                    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                } catch (e) {}

                if (typeof document.startViewTransition !== 'function' || reduced || !event) {
                    actionCallback();
                    return;
                }

                const x = event.clientX !== undefined ? event.clientX : window.innerWidth / 2;
                const y = event.clientY !== undefined ? event.clientY : window.innerHeight / 2;
                const endRadius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));

                try {
                    const vt = document.startViewTransition(function () { actionCallback(); });
                    vt.ready.then(function () {
                        document.documentElement.animate(
                            { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${endRadius}px at ${x}px ${y}px)`] },
                            { duration: 420, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', pseudoElement: '::view-transition-new(root)' }
                        );
                    }).catch(function () {});
                } catch (e) {
                    actionCallback();
                }
            }

                    const active = btn.dataset.target === themeName;
                    btn.classList.toggle('ring-2', active);
                    btn.classList.toggle('ring-md-primary', active);
                    btn.classList.toggle('ring-transparent', !active);
                });
                const wrap = document.getElementById('custom-picker-wrap');
                if (wrap) {
                    wrap.classList.remove('ring-2', 'ring-md-primary');

                }
                updateChromeThemeColor();

            function generateCustomTheme(hexColor, shouldSave) {
                if (typeof hexColor !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(hexColor)) return;
                const r = parseInt(hexColor.slice(1, 3), 16) / 255;
                const g = parseInt(hexColor.slice(3, 5), 16) / 255;
                const b = parseInt(hexColor.slice(5, 7), 16) / 255;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                let h = 0;
                let s = 0;
                const l = (max + min) / 2;
                if (max !== min) {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
                    else if (max === g) h = (b - r) / d + 2;
                    else h = (r - g) / d + 4;
                    h /= 6;
                }
                h = Math.round(h * 360);
                s = Math.round(s * 100);
                const c = function (off) { return Math.max(0, s - off); };
                const isDark = document.documentElement.classList.contains('dark');
                const css = !isDark
                    ? `:root[data-theme="custom"], [data-theme="custom"] {
                        --md-primary: hsl(${h},${s}%,40%); --md-on-primary: #fff;
                        --md-primary-container: hsl(${h},${c(50)}%,92%); --md-on-primary-container: hsl(${h},${s}%,10%);
                        --md-secondary-container: hsl(${h},${c(60)}%,94%); --md-on-secondary-container: hsl(${h},${s}%,15%);
                        --md-surface: hsl(${h},${c(40)}%,99%); --md-on-surface: hsl(${h},${c(10)}%,10%);
                        --md-surface-variant: hsl(${h},${c(30)}%,90%); --md-on-surface-variant: hsl(${h},${c(20)}%,30%);
                        --md-surface-container-low: hsl(${h},${c(40)}%,97%); --md-surface-container: hsl(${h},${c(40)}%,95%);
                        --md-surface-container-high: hsl(${h},${c(30)}%,92%); --md-surface-container-highest: hsl(${h},${c(30)}%,88%);
                        --md-outline: hsl(${h},${c(40)}%,50%); --md-body-bg: hsl(${h},${c(40)}%,96%);
                    }`
                    : `.dark[data-theme="custom"] {
                        --md-primary: hsl(${h},${s}%,72%); --md-on-primary: hsl(${h},${s}%,10%);
                        --md-primary-container: hsl(${h},${s}%,25%); --md-on-primary-container: hsl(${h},${s}%,95%);
                        --md-secondary-container: hsl(${h},${c(15)}%,22%); --md-on-secondary-container: hsl(${h},${c(10)}%,95%);
                        --md-surface: hsl(${h},${c(15)}%,12%); --md-on-surface: hsl(${h},${c(10)}%,95%);
                        --md-surface-variant: hsl(${h},${c(10)}%,35%); --md-on-surface-variant: hsl(${h},${c(20)}%,80%);
                        --md-surface-container-low: hsl(${h},${c(10)}%,10%); --md-surface-container: hsl(${h},${c(10)}%,14%);
                        --md-surface-container-high: hsl(${h},${c(10)}%,18%); --md-surface-container-highest: hsl(${h},${c(10)}%,23%);
                        --md-outline: hsl(${h},${c(10)}%,60%); --md-body-bg: hsl(${h},${c(15)}%,9%);
                    }`;

                const styleTag = document.getElementById('custom-theme-style');
                if (styleTag) styleTag.textContent = css;
                document.documentElement.setAttribute('data-theme', 'custom');
                document.querySelectorAll('.theme-btn').forEach(function (btn) {
                    btn.classList.remove('ring-2', 'ring-md-primary');
                    btn.classList.add('ring-transparent');
                });
                const wrap = document.getElementById('custom-picker-wrap');
                if (wrap) {
                    wrap.classList.remove('border-2', 'border-black/30', 'dark:border-white/20');
                    wrap.classList.add('ring-2', 'ring-md-primary');
                }
                updateChromeThemeColor();
                if (shouldSave) savePrefs({ theme: 'custom', customColor: hexColor });
            }

            function applyUrlThemeOverrides() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    if (!params.toString()) return;

                    const modeParam = params.get('mode');
                    const darkParam = params.get('dark');
                    if (modeParam === 'dark' || modeParam === 'light') {
                        toggleDarkMode(modeParam === 'dark');

                        toggleDarkMode(darkParam === '1');

                    const surfParam = params.get('surface');
                    if (ALLOWED_SURFACES.includes(surfParam)) setSurfaceMode(surfParam, false);

                    const bgParam = params.get('bg');
                    if (ALLOWED_BGS.includes(bgParam)) setBackgroundStyle(bgParam, false);

                    const themeParam = params.get('theme');
                    const customCol = params.get('customColor');
                    if (themeParam === 'custom' && customCol && /^[0-9a-fA-F]{6}$/.test(customCol)) {
                        const hex = `#${customCol}`;

            /* =========================================================
               5. SCHEDULE, HEADER, PAGE SWITCH, ABOUT ME & CAPSULES
               ========================================================= */
            function computeNextOccurrences() {
                const now = new Date();
                const t = I18N[currentLang];

                function berlinWallToDate(year, month, day, hour, minute) {
                    const approx = new Date(Date.UTC(year, month, day, hour, minute));
                    const berlinStr = approx.toLocaleString('en-US', { timeZone: 'Europe/Berlin' });
                    const berlinAsUtc = new Date(berlinStr + ' UTC');
                    return new Date(approx.getTime() - (berlinAsUtc - approx));
                }

                const results = CONFIG.scheduleSlots.map(function (slot) {
                    let candidate = new Date(now.getTime() + 86400000);
                    try {
                        for (let addDays = 0; addDays <= 7; addDays++) {
                            const testDate = new Date(now.getTime() + addDays * 86400000);
                            const parts = new Intl.DateTimeFormat('en-US', {
                                timeZone: 'Europe/Berlin',
                                year: 'numeric',
                                month: 'numeric',
                                day: 'numeric',
                                weekday: 'short'
                            }).formatToParts(testDate);
                            const map = Object.fromEntries(parts.map(function (p) { return [p.type, p.value]; }));
                            const wkMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
                            if (wkMap[map.weekday] === slot.weekday) {
                                const dt = berlinWallToDate(Number(map.year), Number(map.month) - 1, Number(map.day), slot.hour, slot.minute);
                                if (dt.getTime() > now.getTime() - 1800000) {
                                    candidate = dt;
                                    break;
                                }
                            }
                        }
                    } catch (e) {}

                    const diffMs = Math.max(0, candidate - now);
                    const totalMins = Math.floor(diffMs / 60000);
                    let localTimeStr = `${String(slot.hour).padStart(2, '0')}:${String(slot.minute).padStart(2, '0')}`;
                    try {
                        localTimeStr = candidate.toLocaleTimeString(
                            currentLang === 'de' ? 'de-DE' : 'en-US',
                            { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' }
                        );
                    } catch (e) {}

                    return {
                        ...slot,
                        diffMs: diffMs,
                        localDay: t.days[candidate.getDay()],
                        localTime: localTimeStr,
                        countdown: t.inTime(Math.floor(totalMins / 1440), Math.floor((totalMins % 1440) / 60), totalMins % 60),
                        isNext: false
                    };
                });

                let minDiff = Infinity;
                let nextIdx = 0;
                results.forEach(function (r, i) {
                    if (r.diffMs < minDiff) {
                        minDiff = r.diffMs;
                        nextIdx = i;
                    }
                });
                if (results[nextIdx]) results[nextIdx].isNext = true;
                return results;
            }

            function renderLinks() {
                const container = document.getElementById('links-container');
                const pillContainer = document.getElementById('bottom-pill');
                if (!container || !pillContainer) return;

                container.innerHTML = '';
                pillContainer.innerHTML = '';

                if (linkObserver) linkObserver.disconnect();
                renderedLinks = [];

                if ('IntersectionObserver' in window) {
                    linkObserver = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            const item = renderedLinks.find(function (x) { return x.id === entry.target.dataset.id; });
                            if (item) item.isVisible = entry.isIntersecting;
                        });
                        renderBottomPill();
                    }, { threshold: 0.1 });
                }

                // Live Twitch floats to top; all 8 links render as separate uniform compact capsules
                const sorted = [...CONFIG.links].sort(function (a, b) {
                    if (a.isLive && !b.isLive) return -1;
                    if (!a.isLive && b.isLive) return 1;
                    return 0;
                });

                sorted.forEach(function (link, idx) {
                    const created = createLinkCardElement(link, idx);
                    container.appendChild(created.card);
                    renderedLinks.push({ id: created.linkId, isVisible: true, element: created.card });
                    if (linkObserver) linkObserver.observe(created.card);

                    const pillBtn = document.createElement('button');
                    pillBtn.type = 'button';
                    pillBtn.id = `pill-btn-${created.linkId}`;
                    pillBtn.title = created.displayName;
                    pillBtn.setAttribute('aria-label', created.displayName);
                    pillBtn.className = 'overflow-hidden min-w-0 p-0 transition-all duration-500 ease-bouncy flex items-center justify-center shrink-0 rounded-full bg-md-secondaryContainer/40 hover:bg-md-primaryContainer/60 w-0 h-10 opacity-0 scale-50 mx-0 pointer-events-none touch-manipulation';
                    pillBtn.innerHTML = `<div class="w-5 h-5 shrink-0 flex items-center justify-center">${getLogoSvg(link.id, 'w-5 h-5')}</div>`;
                    pillBtn.addEventListener('click', function () {
                        if (isAboutPageOpen) setPage('links');
                        created.card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        created.card.classList.add('ring-4', 'ring-md-primary/50', 'scale-[1.02]');
                        setTimeout(function () {
                            created.card.classList.remove('ring-4', 'ring-md-primary/50', 'scale-[1.02]');
                        }, 750);
                    });
                    pillContainer.appendChild(pillBtn);
                });
            }

            function renderBottomPill() {
                const pill = document.getElementById('bottom-pill');
                if (!pill) return;
                let hiddenCount = 0;
                renderedLinks.forEach(function (item) {
                    const btn = document.getElementById(`pill-btn-${item.id}`);
                    if (!btn) return;
                    if (!item.isVisible) {
                        hiddenCount++;
                        btn.style.width = '40px';
                        btn.style.margin = '0 4px';
                        btn.style.opacity = '1';
                        btn.style.transform = 'scale(1)';
                        btn.style.pointerEvents = 'auto';
                    } else {
                        btn.style.width = '0px';
                        btn.style.margin = '0px';
                        btn.style.opacity = '0';
                        btn.style.transform = 'scale(0.5)';
                        btn.style.pointerEvents = 'none';
                    }
                });
                const show = hiddenCount > 0 && !isAboutPageOpen;
                pill.classList.toggle('translate-y-0', show);
                pill.classList.toggle('opacity-100', show);
                pill.classList.toggle('scale-100', show);
                pill.classList.toggle('translate-y-24', !show);
                pill.classList.toggle('opacity-0', !show);
                pill.classList.toggle('scale-95', !show);
            }

            /* =========================================================
               6. POINTER SHEEN, OVERSCROLL & DRAGGABLE FAB
               ========================================================= */
            function setupGlassSheen() {
                try {
                    if (!window.matchMedia || !window.matchMedia('(hover: hover)').matches) return;
                } catch (e) { return; }
                document.addEventListener('pointermove', function (e) {
                    const target = e.target && e.target.closest ? e.target.closest('.glass-sheen') : null;
                    if (!target) return;
                    const r = target.getBoundingClientRect();
                    target.style.setProperty('--mouse-x', `${e.clientX - r.left}px`);
                    target.style.setProperty('--mouse-y', `${e.clientY - r.top}px`);
                }, { passive: true });
            }

            function setupDraggableFAB() {
                const fab = document.getElementById('fab-container');
                const iconView = document.getElementById('fab-icon-view');
                const panelView = document.getElementById('fab-panel-view');
                const closeBtn = document.getElementById('close-fab-btn');
                if (!fab || !iconView || !panelView || !closeBtn) return;

                let isDragging = false;
                let startX = 0;
                let startY = 0;
                let initLeft = 0;
                let initTop = 0;

                const prefs = loadPrefs();
                if (prefs.fabPos && typeof prefs.fabPos === 'object') {
                    fab.style.left = prefs.fabPos.left || 'auto';
                    fab.style.right = prefs.fabPos.right || 'auto';
                    fab.style.top = prefs.fabPos.top || 'auto';
                    fab.style.bottom = prefs.fabPos.bottom || 'auto';
                }

                function expandFAB() {
                    if (isFabExpanded) return;
                    isFabExpanded = true;
                    hapticTap('medium');
                    fab.classList.remove('fab-collapsed');
                    fab.classList.add('fab-expanded');
                    iconView.style.opacity = '0';
                    setTimeout(function () {
                        if (!isFabExpanded) return;
                        panelView.style.opacity = '1';
                        panelView.style.pointerEvents = 'auto';
                    }, 140);
                }

                function collapseFAB(e) {
                    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
                    if (!isFabExpanded) return;
                    isFabExpanded = false;
                    fab.classList.remove('fab-expanded');
                    fab.classList.add('fab-collapsed');
                    panelView.style.opacity = '0';
                    panelView.style.pointerEvents = 'none';
                    setTimeout(function () {
                        if (isFabExpanded) return;
                        iconView.style.opacity = '1';
                    }, 140);
                }

                collapseFabFn = collapseFAB;

                function onDragMove(e) {
                    if (isFabExpanded) return;
                    const cx = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                    const cy = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                    const dx = cx - startX;
                    const dy = cy - startY;

                    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                        isDragging = true;
                        if (e.cancelable) e.preventDefault();
                    }

                    if (isDragging) {
                        fab.style.transition = 'none';
                        fab.style.left = `${initLeft + dx}px`;
                        fab.style.top = `${initTop + dy}px`;
                        fab.style.right = 'auto';
                        fab.style.bottom = 'auto';
                    }
                }

                function onDragEnd() {
                    document.removeEventListener('mousemove', onDragMove);
                    document.removeEventListener('touchmove', onDragMove);
                    document.removeEventListener('mouseup', onDragEnd);
                    document.removeEventListener('touchend', onDragEnd);
                    document.body.style.userSelect = '';

                    if (!isDragging && !isFabExpanded) {
                        expandFAB();
                    } else if (isDragging) {
                        fab.style.transition = '';
                        const rect = fab.getBoundingClientRect();
                        const winW = window.innerWidth;
                        const winH = window.innerHeight;
                        const pos = { left: 'auto', right: 'auto', top: 'auto', bottom: 'auto' };

                        if (rect.left + rect.width / 2 > winW / 2) {
                            pos.right = `${Math.max(16, Math.round(winW - rect.right))}px`;
                        } else {
                            pos.left = `${Math.max(16, Math.round(rect.left))}px`;
                        }

                        if (rect.top + rect.height / 2 > winH / 2) {
                            pos.bottom = `${Math.max(16, Math.round(winH - rect.bottom))}px`;
                        } else {
                            pos.top = `${Math.max(16, Math.round(rect.top))}px`;
                        }

                        fab.style.left = pos.left;
                        fab.style.right = pos.right;
                        fab.style.top = pos.top;
                        fab.style.bottom = pos.bottom;
                        savePrefs({ fabPos: pos });
                        hapticTap('heavy');
                    }
                    isDragging = false;
                }

                function onDragStart(e) {
                    if (isFabExpanded) return;
                    if (e.target && e.target.closest && e.target.closest('#fab-panel-view')) return;
                    document.body.style.userSelect = 'none';
                    const rect = fab.getBoundingClientRect();
                    initLeft = rect.left;
                    initTop = rect.top;
                    startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                    startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                    isDragging = false;

                    document.addEventListener('mousemove', onDragMove);
                    document.addEventListener('touchmove', onDragMove, { passive: false });
                    document.addEventListener('mouseup', onDragEnd);
                    document.addEventListener('touchend', onDragEnd);
                }

                fab.addEventListener('mousedown', onDragStart);
                fab.addEventListener('touchstart', onDragStart, { passive: false });
                closeBtn.addEventListener('click', collapseFAB);

                function onOutsideInteraction(e) {
                    if (isFabExpanded && !fab.contains(e.target)) {
                        collapseFAB(e);
                    }
                }
                document.addEventListener('mousedown', onOutsideInteraction);
                document.addEventListener('touchstart', onOutsideInteraction, { passive: true });
            }

            /* =========================================================
               7. TWITCH LIVE CHECK & STATIC CONTROL WIRING
               ========================================================= */
            async function checkTwitchLiveStatus() {
                const twitchLink = CONFIG.links.find(function (l) { return l.id === 'twitch'; });
                if (!twitchLink) return;

                try {
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('live') === '1') {
                        twitchLink.isLive = true;
                        twitchLink.isExpandable = true;
                        twitchLink.streamTitle = 'LIVE TEST: Mario Odyssey Chaos & Chatting!';
                        twitchLink.streamGame = 'Super Mario Odyssey';
                        renderHeader();
                        renderLinks();
                        return;
                    }
                } catch (e) {}

                try {
                    const response = await fetch('https://decapi.me/twitch/uptime/ir_fabi');
                    if (!response.ok) return;
                    const text = (await response.text()).toLowerCase();
                    if (text && !text.includes('offline') && !text.includes('not found') && !text.includes('error')) {
                        const resPair = await Promise.all([
                            fetch('https://decapi.me/twitch/title/ir_fabi').then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
                            fetch('https://decapi.me/twitch/game/ir_fabi').then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; })
                        ]);
                        twitchLink.isLive = true;
                        twitchLink.isExpandable = true;
                        twitchLink.streamTitle = resPair[0] || 'Live on Twitch!';
                        twitchLink.streamGame = resPair[1] || 'Just Chatting';
                        renderHeader();
                        renderLinks();
                    }
                } catch (e) {}
            }

                });
            }

            /* =========================================================
               8. PREFERENCES & INITIALIZATION
               ========================================================= */
            function applySavedPreferences() {
                const prefs = loadPrefs();
                if (typeof prefs.dark === 'boolean') toggleDarkMode(prefs.dark);
                setSurfaceMode(ALLOWED_SURFACES.includes(prefs.surface) ? prefs.surface : 'liquid', false);
                setBackgroundStyle(ALLOWED_BGS.includes(prefs.bg) ? prefs.bg : 'blobs', false);

                if (ALLOWED_LANGS.includes(prefs.lang)) {
                    currentLang = prefs.lang;
                    document.documentElement.lang = currentLang;
                }

                if (prefs.theme === 'custom' && typeof prefs.customColor === 'string' && /^#[0-9a-fA-F]{6}$/.test(prefs.customColor)) {
                    const picker = document.getElementById('custom-color-picker');
                    if (picker) picker.value = prefs.customColor;
                    generateCustomTheme(prefs.customColor, false);
                } else if (ALLOWED_THEMES.includes(prefs.theme) && prefs.theme !== 'custom') {
                    setTheme(prefs.theme, false);
                } else {
                    setTheme('lavender', false);
                }

                applyUrlThemeOverrides();
                updateFabLabels();
                updateChromeThemeColor();
            }

            function initApp() {
                try {
                    applySavedPreferences();
                    setupStaticControls();
                    renderHeader();
                    renderAboutPage();
                    setupAboutAccordions();
                    renderLinks();
                    setupDraggableFAB();
                    setupGlassSheen();
                    checkTwitchLiveStatus();
                    setTimeout(function () { isInitialRender = false; }, 160);
                } catch (err) {
                    console.error('App initialization error:', err);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }
        })();
    </script>
</body>
</html>
