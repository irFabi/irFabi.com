        body { -webkit-tap-highlight-color: transparent; }

        .ripple-surface { position: relative; overflow: hidden; transform: translateZ(0); }
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            animation: ripple-animation 400ms linear; background-color: currentColor;
            opacity: 0; pointer-events: none; z-index: 0;
        }
        @keyframes ripple-animation {
            0% { transform: scale(0); opacity: 0.12; }
            100% { transform: scale(4); opacity: 0; }
        }

        .fade-in-up {
            opacity: 0; transform: translateY(20px);
            animation: fadeInUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        * { transition: background-color 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }

        /* Draggable FAB - Dynamic CSS Positioning */

            touch-action: none;

                        border-radius 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),

                        left 0.4s ease, right 0.4s ease, top 0.4s ease, bottom 0.4s ease;
            position: fixed;
        }
        .fab-expanded {
            width: 320px !important;
            height: 280px !important;
            border-radius: 24px !important;

        .fab-collapsed {

    <script>
        // Data configuration with all requested specific links
        const CONFIG = {
            profile: {
                name: "the_farbie",
                handle: "@the_farbie",
                bio: "Content Creator & Streamer. Welcome to my digital hub!",
                avatarUrl: "https://placehold.co/400x400/var(--md-primary-container)/var(--md-on-primary-container)?text=F"
            },
            links: [
                {
                    name: "YouTube",
                    subtitle: "@ir_Fabi",
                    url: "https://youtube.com/@ir_Fabi",
                    icon: "ph-fill ph-youtube-logo", 
                    iconColor: "#FF0000",
                    isExpandable: true,
                    videoId: "dQw4w9WgXcQ"
                },
                {
                    name: "Twitch",
                    subtitle: "the_farbie",
                    url: "https://twitch.tv/the_farbie",
                    icon: "ph-fill ph-twitch-logo",
                    iconColor: "#9146FF",
                    isLive: false // Will be updated dynamically via API
                },
                {
                    name: "Instagram",
                    subtitle: "@the_farbie",
                    url: "https://instagram.com/the_farbie",
                    icon: "ph-fill ph-instagram-logo",
                    iconColor: "#E1306C"
                },
                {
                    name: "Twitter",
                    subtitle: "@the_farbie",
                    url: "https://twitter.com/the_farbie",
                    icon: "ph-fill ph-twitter-logo",
                    iconColor: "#1DA1F2"
                },
                {
                    name: "TikTok",
                    subtitle: "@the_farbie",
                    url: "https://tiktok.com/@the_farbie",
                    icon: "ph-fill ph-tiktok-logo",
                    iconColor: "#ff0050"
                },
                {
                    name: "Discord",
                    subtitle: "Join the server",
                    url: "https://discord.gg/",
                    icon: "ph-fill ph-discord-logo",
                    iconColor: "#5865F2"
                }
            ]
        };

        async function checkTwitchLiveStatus() {
            try {
                const response = await fetch('https://decapi.me/twitch/uptime/the_farbie');
                const text = await response.text();
                
                const twitchLink = CONFIG.links.find(l => l.name === "Twitch");
                if (twitchLink) {
                    const statusText = text.toLowerCase();
                    if (!statusText.includes('offline') && !statusText.includes('not found')) {
                        twitchLink.isLive = true;
                    } else {
                        twitchLink.isLive = false;
                    }
                    renderLinks(); 
                }
            } catch (error) {
                console.error("Failed to fetch Twitch status:", error);
            }
        }

        function initApp() {
            renderHeader();
            renderLinks();
            checkTwitchLiveStatus(); // Check live status and re-render if needed
            setupDraggableFAB();
            
            // Auto dark mode detection
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                if(!document.documentElement.classList.contains('dark')) toggleDarkMode(true);
            }
        }

        function toggleDarkMode(forceDark = null) {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            if(forceDark === true || !html.classList.contains('dark')) {
                html.classList.add('dark');
                icon.classList.replace('ph-moon', 'ph-sun');
                text.textContent = "Light Mode";
            } else {
                html.classList.remove('dark');
                icon.classList.replace('ph-sun', 'ph-moon');
                text.textContent = "Dark Mode";
            }
            
            // Regenerate custom theme if active
            if(html.getAttribute('data-theme') === 'custom') {
                generateCustomTheme(document.getElementById('custom-color-picker').value);
            }
        }

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if(btn.dataset.target === themeName) {
                    btn.classList.remove('ring-transparent');
                    btn.classList.add('ring-2', 'ring-md-primary');
                } else {
                    btn.classList.add('ring-transparent');
                    btn.classList.remove('ring-2', 'ring-md-primary');
                }
            });
            
            const customPickerContainer = document.getElementById('custom-color-picker').parentElement;
            customPickerContainer.classList.remove('ring-2', 'ring-md-primary');
            customPickerContainer.classList.add('border-2', 'border-md-outline/30');
        }

        function generateCustomTheme(hexColor) {
            let r = parseInt(hexColor.substr(1,2),16) / 255;
            let g = parseInt(hexColor.substr(3,2),16) / 255;
            let b = parseInt(hexColor.substr(5,2),16) / 255;
            
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            
            if(max === min) h = s = 0;
            else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch(max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            
            h = Math.round(h * 360); s = Math.round(s * 100);
            const isDark = document.documentElement.classList.contains('dark');
            let styleRules = '';
            
            if(!isDark) {
                styleRules = `
                :root[data-theme="custom"], [data-theme="custom"] {
                    --md-primary: hsl(${h}, ${s}%, 40%);
                    --md-on-primary: #ffffff;
                    --md-primary-container: hsl(${h}, Math.max(0, ${s}-50)%, 92%);
                    --md-on-primary-container: hsl(${h}, ${s}%, 10%);
                    --md-secondary-container: hsl(${h}, Math.max(0, ${s}-60)%, 95%);
                    --md-on-secondary-container: hsl(${h}, ${s}%, 15%);
                    --md-surface: hsl(${h}, Math.max(0, ${s}-40)%, 99%);
                    --md-on-surface: hsl(${h}, Math.max(0, ${s}-10)%, 10%);
                    --md-surface-variant: hsl(${h}, Math.max(0, ${s}-30)%, 90%);
                    --md-surface-container-high: hsl(${h}, Math.max(0, ${s}-30)%, 92%);
                    --md-surface-container-highest: hsl(${h}, Math.max(0, ${s}-30)%, 88%);
                    --md-outline: hsl(${h}, Math.max(0, ${s}-40)%, 50%);
                    --md-body-bg: hsl(${h}, Math.max(0, ${s}-40)%, 96%);
                }`;
            } else {
                styleRules = `
                .dark[data-theme="custom"] {
                    --md-primary: hsl(${h}, ${s}%, 80%);
                    --md-on-primary: hsl(${h}, ${s}%, 20%);
                    --md-primary-container: hsl(${h}, Math.max(0, ${s}-50)%, 20%);
                    --md-on-primary-container: hsl(${h}, ${s}%, 90%);
                    --md-secondary-container: hsl(${h}, Math.max(0, ${s}-60)%, 18%);
                    --md-on-secondary-container: hsl(${h}, Math.max(0, ${s}-20)%, 90%);
                    --md-surface: hsl(${h}, Math.max(0, ${s}-20)%, 10%);
                    --md-on-surface: hsl(${h}, Math.max(0, ${s}-10)%, 90%);
                    --md-surface-variant: hsl(${h}, Math.max(0, ${s}-30)%, 30%);
                    --md-surface-container-high: hsl(${h}, Math.max(0, ${s}-30)%, 15%);
                    --md-surface-container-highest: hsl(${h}, Math.max(0, ${s}-30)%, 20%);
                    --md-outline: hsl(${h}, Math.max(0, ${s}-40)%, 60%);
                    --md-body-bg: hsl(${h}, Math.max(0, ${s}-20)%, 8%);
                }`;
            }
            
            document.getElementById('custom-theme-style').innerHTML = styleRules;
            document.documentElement.setAttribute('data-theme', 'custom');
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.add('ring-transparent'); btn.classList.remove('ring-2', 'ring-md-primary');
            });
            const customPickerContainer = document.getElementById('custom-color-picker').parentElement;
            customPickerContainer.classList.remove('border-2', 'border-md-outline/30');
            customPickerContainer.classList.add('ring-2', 'ring-md-primary');
        }

        function setupDraggableFAB() {
            const fab = document.getElementById('fab-container');
            const iconView = document.getElementById('fab-icon-view');
            const panelView = document.getElementById('fab-panel-view');
            const closeBtn = document.getElementById('close-fab-btn');
            
            let isDragging = false;
            let isExpanded = false;
            let startX, startY;
            let initialLeft, initialTop;

            function dragStart(e) {
                if (isExpanded) return;
                if (e.target.closest('#fab-panel-view')) return; 

                // Prevent text selection across the site while dragging
                document.body.style.userSelect = 'none';

                const rect = fab.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;

                if (e.type === "touchstart") {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }

                isDragging = false; 
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, {passive: false});
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);
            }

            function drag(e) {
                if (isExpanded) return;

                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                let dx = clientX - startX;
                let dy = clientY - startY;

                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    isDragging = true;
                    if(e.cancelable) e.preventDefault(); 
                }

                if (isDragging) {
                    // Suspend transitions during active drag to lock to pointer
                    fab.style.transition = 'none';
                    fab.style.left = `${initialLeft + dx}px`;
                    fab.style.top = `${initialTop + dy}px`;
                    fab.style.right = 'auto';
                    fab.style.bottom = 'auto';
                }
            }

            function dragEnd(e) {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchend', dragEnd);

                // Restore user text selection
                document.body.style.userSelect = '';

                if (!isDragging && !isExpanded) {
                    expandFAB();
                } else if (isDragging) {
                    // Re-enable smooth transitions for pinning and expanding
                    fab.style.transition = '';
                    
                    // Logic to snap and pin to edges so it expands inward based on quadrant
                    const rect = fab.getBoundingClientRect();
                    const winW = window.innerWidth;
                    const winH = window.innerHeight;
                    const fabCenterX = rect.left + (rect.width / 2);
                    const fabCenterY = rect.top + (rect.height / 2);

                    if (fabCenterX > winW / 2) {
                        fab.style.right = `${winW - rect.right}px`;
                        fab.style.left = 'auto';
                    } else {
                        fab.style.left = `${rect.left}px`;
                        fab.style.right = 'auto';
                    }

                    if (fabCenterY > winH / 2) {
                        fab.style.bottom = `${winH - rect.bottom}px`;
                        fab.style.top = 'auto';
                    } else {
                        fab.style.top = `${rect.top}px`;
                        fab.style.bottom = 'auto';
                    }
                }
                isDragging = false;
            }

            function expandFAB() {
                isExpanded = true;
                fab.classList.replace('fab-collapsed', 'fab-expanded');
                
                iconView.style.opacity = '0';
                iconView.style.pointerEvents = 'none';
                setTimeout(() => {
                    panelView.style.opacity = '1';
                    panelView.style.pointerEvents = 'auto';
                }, 150);
            }

            function collapseFAB(e) {
                if(e) e.stopPropagation();
                isExpanded = false;
                
                fab.classList.replace('fab-expanded', 'fab-collapsed');
                
                panelView.style.opacity = '0';
                panelView.style.pointerEvents = 'none';
                setTimeout(() => {
                    iconView.style.opacity = '1';
                    iconView.style.pointerEvents = 'none';
                }, 150);
            }

            function handleOutsideClick(e) {
                if (isExpanded && !fab.contains(e.target)) collapseFAB(e);
            }

            fab.addEventListener('mousedown', dragStart);
            fab.addEventListener('touchstart', dragStart, {passive: false});
            closeBtn.addEventListener('click', collapseFAB);
            closeBtn.addEventListener('touchstart', collapseFAB, {passive: true});
            document.addEventListener('mousedown', handleOutsideClick);
            document.addEventListener('touchstart', handleOutsideClick, {passive: true});
        }

        function renderHeader() {
            const headerContainer = document.getElementById('profile-header');
            headerContainer.innerHTML = `
                <div class="relative group cursor-pointer mb-5 mx-auto flex justify-center items-center">
                    <div class="w-28 h-28 rounded-[2rem] bg-md-primaryContainer text-md-onPrimaryContainer flex items-center justify-center overflow-hidden shadow-m3-2 transition-all duration-300 ease-bouncy group-hover:shadow-m3-3 group-hover:scale-110 relative z-10 border-2 border-transparent group-hover:border-md-primary/30 mx-auto">
                        <img src="${CONFIG.profile.avatarUrl}" alt="${CONFIG.profile.name}" class="w-full h-full object-cover transition-opacity duration-200" onerror="this.style.display='none'">
                        <i class="ph-fill ph-user text-5xl absolute -z-10"></i>
                    </div>
                </div>
                <h1 class="text-3xl font-bold tracking-tight text-md-onSurface mb-1 text-center">${CONFIG.profile.name}</h1>
                <div class="flex justify-center w-full">
                    <p class="text-md-onSurfaceVariant font-medium flex items-center justify-center gap-1.5 text-sm bg-md-surfaceContainerHighest px-3 py-1 rounded-lg mt-1 transition-colors hover:bg-md-primaryContainer hover:text-md-onPrimaryContainer cursor-default border border-md-outline/10 w-max mx-auto">
                        <i class="ph-fill ph-link"></i> ${CONFIG.profile.handle}
                    </p>
                </div>
                <p class="text-md-onSurfaceVariant text-sm mt-4 max-w-[280px] mx-auto text-center">
                    ${CONFIG.profile.bio}
                </p>
            `;
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = ''; 

            // Live sorting logic: If isLive is true, sort to the top
            const sortedLinks = [...CONFIG.links].sort((a, b) => {
                if (a.isLive && !b.isLive) return -1;
                if (!a.isLive && b.isLive) return 1;
                return 0;
            });

            sortedLinks.forEach((link, index) => {
                const delay = 0.1 + (index * 0.1);
                
                // Create a container block for each link so it handles expansion cleanly
                const linkBlock = document.createElement('div');
                linkBlock.className = `fade-in-up flex flex-col w-full bg-md-surfaceContainerHigh border border-md-outline/5 rounded-[28px] shadow-m3-1 transition-all duration-300 ease-bouncy hover:shadow-m3-2 overflow-hidden`;
                linkBlock.style.animationDelay = `${delay}s`;
                
                // Construct the inner clickable content logic
                const innerContent = `
                    <div class="w-[56px] h-[56px] shrink-0 flex items-center justify-center bg-md-secondaryContainer/40 text-md-onSecondaryContainer rounded-[28px] shadow-sm transition-all duration-300 ease-bouncy group-hover:w-[112px] group-hover:rounded-[16px] group-hover:shadow-m3-1 group-hover:bg-md-primaryContainer/50 z-10 overflow-hidden relative" style="transition-property: width, border-radius, box-shadow, background-color;">
                        <i class="${link.icon} text-2xl transition-transform duration-300 ease-bouncy group-hover:scale-125 absolute" style="color: ${link.iconColor}"></i>
                    </div>
                    
                    <div class="ml-4 flex flex-col justify-center flex-grow z-10 overflow-hidden">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-[1.05rem] leading-snug tracking-wide group-hover:text-md-primary transition-colors duration-300 ease-bouncy truncate">${link.name}</span>
                            ${link.isLive ? `<span class="flex items-center gap-1.5 text-[10px] font-bold bg-red-500/10 text-red-500 px-2 py-0.5 rounded-full border border-red-500/20"><span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>LIVE</span>` : ''}
                        </div>
                        ${link.subtitle ? `<span class="text-sm opacity-75 mt-0.5 leading-tight truncate text-md-onSurfaceVariant">${link.subtitle}</span>` : ''}
                    </div>
                    
                    <div class="ml-auto pl-2 pr-2 flex items-center justify-center z-10">
                        ${link.isExpandable ? 
                            `<div class="w-8 h-8 flex items-center justify-center rounded-full bg-md-surfaceVariant/50 text-md-onSurfaceVariant group-hover:bg-md-primaryContainer group-hover:text-md-onPrimaryContainer transition-colors duration-300">
                                <i class="ph-bold ph-caret-down text-lg transition-transform duration-300 expand-icon"></i>
                             </div>` 
                            : 
                            `<div class="opacity-0 -translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 ease-bouncy text-md-primary">
                                <i class="ph-bold ph-caret-right text-xl"></i>
                             </div>`
                        }
                    </div>
                `;

                if (link.isExpandable) {
                    // Header acts as the toggle
                    const header = document.createElement('div');
                    header.className = "group ripple-surface flex items-center p-3 w-full cursor-pointer hover:bg-md-surfaceContainerHighest transition-colors duration-300 ease-bouncy relative";
                    header.innerHTML = innerContent;
                    
                    // The expandable content powered by CSS grid transitions
                    const expandedContainer = document.createElement('div');
                    expandedContainer.className = "grid transition-all duration-300 ease-bouncy";
                    expandedContainer.style.gridTemplateRows = "0fr";
                    
                    expandedContainer.innerHTML = `
                        <div class="overflow-hidden">
                            <div class="p-3 pt-0 w-full flex flex-col gap-3">
                                <div class="w-full aspect-video rounded-2xl overflow-hidden bg-black/5 relative shadow-inner">
                                    <iframe class="absolute top-0 left-0 w-full h-full border-0" src="https://www.youtube.com/embed/${link.videoId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                                </div>
                                <a href="${link.url}" target="_blank" class="w-full py-3 bg-md-primary text-md-onPrimary rounded-xl flex items-center justify-center gap-2 font-medium hover:opacity-90 transition-opacity active:scale-[0.98] ripple-surface">
                                    <i class="ph-bold ph-arrow-square-out text-lg"></i> Open Channel
                                </a>
                            </div>
                        </div>
                    `;

                    header.addEventListener('click', (e) => {
                        const isExpanded = expandedContainer.style.gridTemplateRows === "1fr";
                        expandedContainer.style.gridTemplateRows = isExpanded ? "0fr" : "1fr";
                        
                        const icon = header.querySelector('.expand-icon');
                        if (icon) icon.style.transform = isExpanded ? "rotate(0deg)" : "rotate(180deg)";
                    });
                    
                    linkBlock.appendChild(header);
                    linkBlock.appendChild(expandedContainer);
                } else {
                    // Standard Link Action
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = "_blank"; 
                    a.className = "group ripple-surface flex items-center p-3 w-full hover:bg-md-surfaceContainerHighest transition-colors duration-300 ease-bouncy no-underline";
                    a.innerHTML = innerContent;
                    
                    a.addEventListener('mousedown', createRipple);
                    a.addEventListener('touchstart', (e) => {
                        if(e.touches.length > 0) createRipple({currentTarget: a, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY});
                    }, {passive: true});
                    
                    linkBlock.appendChild(a);
                }

                container.appendChild(linkBlock);
            });
        }

        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();
            let clientX = event.clientX || (rect.left + radius);
            let clientY = event.clientY || (rect.top + radius);

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${clientX - rect.left - radius}px`;
            circle.style.top = `${clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            circle.style.color = 'var(--md-primary)';
            
            const existingRipple = button.querySelector('.ripple');
            if (existingRipple) existingRipple.remove();
            
            button.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
            }, 3000);
        }

        function exportConfig() {
            const configString = JSON.stringify(CONFIG, null, 4);
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(configString).then(() => showToast('Config copied!'))
                    .catch(() => fallbackCopyTextToClipboard(configString));
            } else {
                fallbackCopyTextToClipboard(configString);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showToast('Config copied!'); } 
            catch (err) { showToast('Failed to copy.'); }
            document.body.removeChild(textArea);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
